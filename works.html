<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KIVI CLIP Works — Cinematic edits, brand films, reels, and event productions." />
  <title>KIVI CLIP — Works &amp; Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nav-h: 44px;
      --blue: #0071e3;
      --dark: #080808;
      --card: #111111;
      --white: #ffffff;
      --gray: #a1a1a6;
      --font: -apple-system, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;

      /* Portrait row (9:16 vertical reels) */
      --port-w: 180px;
      --port-h: 320px;

      /* Landscape row (16:9 horizontal films) */
      --land-w: 420px;
      --land-h: 236px;

      --gap: 12px;
      --speed-port: 34s;
      --speed-land: 42s;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font);
      background: var(--dark);
      color: var(--white);
      overflow-x: hidden;
      /* Safe area for iPhones with notch/home-indicator */
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    a { text-decoration: none; color: inherit; }

    /* ── NAV ────────────────────────────────────────────── */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      height: var(--nav-h);
      background: rgba(0,0,0,0.88);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      /* safe area left/right for notch */
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    .nav-logo {
      display: flex; align-items: center; gap: 7px;
      font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
      color: var(--white); text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo-mark {
      width: 26px; height: 26px; background: var(--white);
      border-radius: 5px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .nav-logo-mark svg { width: 16px; height: 16px; fill: #000; }

    .nav-right {
      display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    }

    .nav-link-home {
      font-size: 12px; color: rgba(255,255,255,0.65);
      transition: color 0.2s; white-space: nowrap;
    }
    .nav-link-home:hover { color: var(--white); }

    .nav-back {
      font-size: 13px; color: #2997ff; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      transition: opacity 0.2s; white-space: nowrap; background: none; border: none;
    }
    .nav-back:hover { opacity: 0.75; }

    /* ── PAGE HEADER ─────────────────────────────────────── */
    .page-header {
      margin-top: var(--nav-h);
      padding: 64px 24px 40px;
      text-align: center;
    }

    .page-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: #2997ff; margin-bottom: 10px;
    }

    .page-title {
      font-size: clamp(36px, 7vw, 72px);
      font-weight: 700; letter-spacing: -0.04em; line-height: 1.04;
      margin-bottom: 10px;
    }

    .page-sub {
      font-size: clamp(14px, 2vw, 18px);
      color: rgba(255,255,255,0.45); max-width: 500px; margin: 0 auto;
    }

    /* ── ROW SECTION HEADING ─────────────────────────────── */
    .row-section { margin-bottom: 44px; }

    .row-heading {
      font-size: 11px; font-weight: 600; letter-spacing: 0.09em;
      text-transform: uppercase; color: rgba(255,255,255,0.3);
      padding: 0 24px 10px;
    }

    /* ── SHOWCASE WRAPPER (fade edges) ───────────────────── */
    .showcase {
      width: 100%; overflow: hidden;
      -webkit-mask-image: linear-gradient(to right,
        transparent 0, black 5%, black 95%, transparent 100%);
      mask-image: linear-gradient(to right,
        transparent 0, black 5%, black 95%, transparent 100%);
    }

    /* ── SCROLL TRACKS ───────────────────────────────────── */
    .scroll-track {
      display: flex;
      gap: var(--gap);
      width: max-content;
      will-change: transform;
    }

    /* Respect reduced-motion */
    @media (prefers-reduced-motion: no-preference) {
      .track-portrait  { animation: marquee-left  var(--speed-port) linear infinite; }
      .track-landscape { animation: marquee-right var(--speed-land) linear infinite; }
    }

    .scroll-track.paused { animation-play-state: paused !important; }

    @keyframes marquee-left {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @keyframes marquee-right {
      from { transform: translateX(-50%); }
      to   { transform: translateX(0); }
    }

    /* ── THUMBNAIL CARDS ─────────────────────────────────── */
    .thumb {
      position: relative; flex-shrink: 0;
      border-radius: 10px; overflow: hidden;
      background: var(--card); cursor: pointer;
      transition: transform 0.28s ease, box-shadow 0.28s ease;
    }

    .thumb:hover, .thumb:focus-visible {
      transform: scale(1.04);
      box-shadow: 0 14px 44px rgba(0,0,0,0.7);
      outline: none;
    }

    .thumb img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      pointer-events: none;
    }

    /* Portrait (9:16) */
    .thumb-portrait {
      width: var(--port-w);
      height: var(--port-h);
    }

    /* Landscape (16:9) */
    .thumb-landscape {
      width: var(--land-w);
      height: var(--land-h);
    }

    /* Play overlay */
    .thumb-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.32);
      opacity: 0; transition: opacity 0.22s;
    }
    .thumb:hover .thumb-play,
    .thumb:focus-visible .thumb-play { opacity: 1; }

    .thumb-play svg { width: 46px; height: 46px; }

    .thumb-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 24px 12px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, transparent 100%);
      font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.82);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── PLACEHOLDER / MISSING ASSET NOTE ───────────────── */
    .missing-note {
      display: flex; align-items: center; justify-content: center;
      background: var(--card); color: rgba(255,255,255,0.25);
      font-size: 11px; text-align: center; line-height: 1.5; padding: 16px;
    }

    /* ── ADD VIDEOS GUIDE BOX ────────────────────────────── */
    .guide-box {
      max-width: 640px; margin: 36px auto 0;
      padding: 26px 24px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: rgba(255,255,255,0.025);
    }

    .guide-box h3 {
      font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--white);
    }

    .guide-box p {
      font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.7;
    }

    .guide-box code {
      background: rgba(255,255,255,0.08);
      color: #2997ff; padding: 1px 5px; border-radius: 4px;
      font-size: 11px;
    }

    /* ── FOOTER ──────────────────────────────────────────── */
    .page-footer {
      text-align: center; padding: 56px 24px 72px;
    }

    .page-footer p {
      font-size: 12px; color: rgba(255,255,255,0.2); margin-bottom: 18px;
    }

    .btn-home-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.11);
      color: var(--white); font-size: 13px; font-weight: 500;
      padding: 10px 22px; border-radius: 980px;
      transition: background 0.2s, transform 0.2s; cursor: pointer;
    }
    .btn-home-link:hover { background: rgba(255,255,255,0.13); transform: scale(1.02); }

    /* ── MODAL ───────────────────────────────────────────── */
    .modal {
      position: fixed; inset: 0; z-index: 99999;
      background: rgba(0,0,0,0.95);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .modal.open { opacity: 1; pointer-events: auto; }

    .modal-box {
      position: relative; width: 100%; max-width: 920px;
      background: #111; border-radius: 14px; overflow: hidden;
      box-shadow: 0 40px 120px rgba(0,0,0,0.85);
      transform: scale(0.94);
      transition: transform 0.28s ease;
    }

    .modal.open .modal-box { transform: scale(1); }

    .modal-close {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(0,0,0,0.65); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white; transition: background 0.2s;
    }
    .modal-close:hover { background: rgba(0,0,0,0.9); }

    .modal-close svg { width: 14px; height: 14px; }

    .modal-video {
      width: 100%; display: block; max-height: 76vh;
      background: #000; object-fit: contain;
    }

    .modal-info { padding: 14px 18px 18px; }

    .modal-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }

    .modal-meta { font-size: 12px; color: var(--gray); }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 768px) {
      :root {
        --port-w: 140px;
        --port-h: 249px;
        --land-w: 280px;
        --land-h: 158px;
        --speed-port: 26s;
        --speed-land: 32s;
      }

      .page-header { padding: 52px 20px 32px; }

      .nav { height: 48px; }
      body { --nav-h: 48px; }
    }

    @media (max-width: 430px) {
      :root {
        --port-w: 120px;
        --port-h: 213px;
        --land-w: 240px;
        --land-h: 135px;
        --speed-port: 22s;
        --speed-land: 28s;
        --gap: 9px;
      }

      .page-title { font-size: 34px; }
    }

    @media (max-width: 375px) {
      :root {
        --port-w: 108px;
        --port-h: 192px;
        --land-w: 210px;
        --land-h: 118px;
      }
    }
  </style>
</head>
<body>

  <!-- ── NAV ─────────────────────────────────────────────── -->
  <nav class="nav" role="navigation" aria-label="Portfolio navigation">
    <a class="nav-logo" href="index.html" aria-label="KIVI CLIP Home">
      <div class="nav-logo-mark">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2 2h5v12H2V2zm7 0l5 6-5 6V2z"/>
        </svg>
      </div>
      KIVI CLIP
    </a>
    <div class="nav-right">
      <a class="nav-link-home" href="index.html">Home</a>
      <a class="nav-link-home" href="courses.html">Courses</a>
      <button class="nav-back" id="btn-nav-back" aria-label="Go back">← Back</button>
    </div>
  </nav>

  <!-- ── PAGE HEADER ───────────────────────────────────────── -->
  <header class="page-header">
    <p class="page-label">Portfolio</p>
    <h1 class="page-title">Our Work</h1>
    <p class="page-sub">Reels, brand films, event coverage, and cinematic edits.</p>
  </header>

  <!-- ═══════════════════════════════════════════════════════
       ROW 1 — PORTRAIT / REELS (first, at top)
  ═══════════════════════════════════════════════════════════ -->
  <section class="row-section" aria-label="Reels and short-form portfolio">
    <p class="row-heading">Reels &amp; Short-Form · 9:16</p>
    <div class="showcase" id="showcase-portrait">
      <div class="scroll-track track-portrait" id="track-portrait" role="list">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════
       ROW 2 — LANDSCAPE / FILMS (second, below)
  ═══════════════════════════════════════════════════════════ -->
  <section class="row-section" aria-label="Films and brand video portfolio">
    <p class="row-heading">Brand Films &amp; Cinematic Edits · 16:9</p>
    <div class="showcase" id="showcase-landscape">
      <div class="scroll-track track-landscape" id="track-landscape" role="list">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <!-- ── ADD VIDEOS GUIDE ────────────────────────────────── -->


  <!-- ── FOOTER ─────────────────────────────────────────── -->
  <div class="page-footer">
    <p>© 2024 KIVI CLIP. All rights reserved.</p>
    <button class="btn-home-link" id="btn-footer-back">← Back to Home</button>
  </div>

  <!-- ── VIDEO MODAL ────────────────────────────────────── -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Video player">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Close video">
        <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/>
        </svg>
      </button>
      <video class="modal-video" id="modal-video" controls playsinline preload="none"></video>
      <div class="modal-info">
        <p class="modal-title" id="modal-title"></p>
        <p class="modal-meta"  id="modal-meta"></p>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       PORTFOLIO DATA CONFIGURATION
       ═══════════════════════════════════════════════════════
       Add your own videos here.
       poster : thumbnail image (shown in the scrolling row, loads immediately)
       src    : MP4 video file (loaded ONLY when visitor clicks)
       Place files in the paths shown in the guide above.
  ═══════════════════════════════════════════════════════════ -->
  <script>
    'use strict';

    /* ─── EDIT THIS OBJECT TO ADD YOUR VIDEOS ──────────────
       Each entry: { title, meta, poster, src }
       portrait  = vertical 9:16  (Reels, Instagram, TikTok)
       landscape = horizontal 16:9 (YouTube, films, brand videos)
    ──────────────────────────────────────────────────────── */
    const PORTFOLIO = {
      portrait: [
        { title: 'Reels Campaign',    meta: '2024 · Reels',         poster: 'tile3.png',        src: 'videos/portfolio/portrait/reels-campaign.mp4'   },
        { title: 'Instagram Reel',    meta: '2024 · Short-Form',    poster: 'tile1.png',        src: 'videos/portfolio/portrait/instagram-reel.mp4'   },
        { title: 'Product Showcase',  meta: '2024 · Vertical',      poster: 'tile2.png',        src: 'videos/portfolio/portrait/product-showcase.mp4' },
        { title: 'Creative Reel',     meta: '2024 · Reels',         poster: 'hero_bg.png',      src: 'videos/portfolio/portrait/creative-reel.mp4'    },
        { title: 'Event Reel',        meta: '2024 · Event',         poster: 'section2_bg.png',  src: 'videos/portfolio/portrait/event-reel.mp4'       },
        /* Add more portrait entries here */
      ],
      landscape: [
        { title: 'Cinematic Edit',    meta: '2024 · Video Editing', poster: 'hero_bg.png',      src: 'videos/portfolio/landscape/cinematic-edit.mp4'  },
        { title: 'Short Film',        meta: '2024 · Short Film',    poster: 'section2_bg.png',  src: 'videos/portfolio/landscape/short-film.mp4'      },
        { title: 'Brand Film',        meta: '2024 · Production',    poster: 'section3_bg.png',  src: 'videos/portfolio/landscape/brand-film.mp4'      },
        { title: 'Event Highlight',   meta: '2024 · Event Films',   poster: 'tile1.png',        src: 'videos/portfolio/landscape/event-highlight.mp4' },
        { title: 'Production BTS',    meta: '2024 · Behind Scenes', poster: 'tile2.png',        src: 'videos/portfolio/landscape/production-bts.mp4'  },
        /* Add more landscape entries here */
      ]
    };

    /* ─── INTERNALS ─────────────────────────────────────── */
    const PLAY_SVG = `<svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
      <circle cx="26" cy="26" r="26" fill="rgba(0,0,0,0.45)"/>
      <polygon points="21,16 40,26 21,36" fill="white"/>
    </svg>`;

    const modal      = document.getElementById('modal');
    const modalVideo = document.getElementById('modal-video');
    const modalTitle = document.getElementById('modal-title');
    const modalMeta  = document.getElementById('modal-meta');
    const trackPort  = document.getElementById('track-portrait');
    const trackLand  = document.getElementById('track-landscape');
    const allTracks  = [trackPort, trackLand];

    /* Build one card */
    function makeCard(item, shape) {
      const card = document.createElement('div');
      card.className = `thumb thumb-${shape}`;
      card.setAttribute('role', 'listitem');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `Play: ${item.title}`);

      const img = document.createElement('img');
      img.src     = item.poster || '';
      img.alt     = item.title;
      img.loading = 'lazy';
      img.decoding = 'async';

      /* If poster is missing, show a dark placeholder */
      img.onerror = () => {
        img.style.display = 'none';
        card.style.background = '#1a1a1a';
      };

      const playEl = document.createElement('div');
      playEl.className = 'thumb-play';
      playEl.innerHTML = PLAY_SVG;
      playEl.setAttribute('aria-hidden', 'true');

      const labelEl = document.createElement('div');
      labelEl.className = 'thumb-label';
      labelEl.textContent = item.title;

      card.appendChild(img);
      card.appendChild(playEl);
      card.appendChild(labelEl);

      const open = () => openModal(item);
      card.addEventListener('click', open);
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });

      return card;
    }

    /* Populate a track with items + one duplicate set for seamless loop */
    function populateTrack(trackEl, items, shape) {
      if (!items || !items.length) return;
      const frag = document.createDocumentFragment();
      /* Two copies — the CSS animation moves -50% so the second set
         is always ready and the loop is visually seamless */
      for (let pass = 0; pass < 2; pass++) {
        items.forEach(item => frag.appendChild(makeCard(item, shape)));
      }
      trackEl.appendChild(frag);
    }

    /* Modal open */
    function openModal(item) {
      allTracks.forEach(t => t.classList.add('paused'));
      modalVideo.src    = item.src;
      modalVideo.poster = item.poster || '';
      modalTitle.textContent = item.title;
      modalMeta.textContent  = item.meta || '';
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      modalVideo.play().catch(() => {});
    }

    /* Modal close */
    function closeModal() {
      modalVideo.pause();
      modalVideo.src = '';
      modal.classList.remove('open');
      document.body.style.overflow = '';
      allTracks.forEach(t => t.classList.remove('paused'));
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
    });

    /* Back navigation — use browser history when available */
    function goBack() {
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'index.html';
    }

    document.getElementById('btn-nav-back').addEventListener('click', goBack);
    document.getElementById('btn-footer-back').addEventListener('click', goBack);

    /* Hide guide box once real videos are wired up (more than 10 placeholders) */
    function maybeHideGuide() {
      const total = PORTFOLIO.portrait.length + PORTFOLIO.landscape.length;
      if (total > 10) document.getElementById('guide-box').style.display = 'none';
    }

    /* ─── INIT ──────────────────────────────────────────── */
    populateTrack(trackPort, PORTFOLIO.portrait,  'portrait');
    populateTrack(trackLand, PORTFOLIO.landscape, 'landscape');
    maybeHideGuide();
  </script>

</body>
</html>
